name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, lint, and benchmark build
    # The existing host OpenCV test loader provisions Windows DLLs.
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all gates
        run: >-
          .\gradlew.bat
          :vision:testDebugUnitTest
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleBenchmark
