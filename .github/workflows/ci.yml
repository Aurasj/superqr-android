name: Android CI

on:
  push:
    branches: [ main, rebuild/v7 ]
  pull_request:
    branches: [ main, rebuild/v7 ]

jobs:
  test:
    name: Test & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Vision unit tests
        run: ./gradlew :vision:testDebugUnitTest

      - name: App unit tests
        id: app_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee app-test.log

      - name: Upload app test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-log
          path: app-test.log
          if-no-files-found: error

      - name: Fail if app tests failed
        if: steps.app_tests.outcome == 'failure'
        run: exit 1

      - name: Build benchmark APK
        run: ./gradlew :app:assembleBenchmark
