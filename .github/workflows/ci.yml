name: Android CI

on:
  push:
    branches: [ main, rebuild/v7-phase0-clean ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test vision and app, build benchmark APK
        run: ./gradlew :vision:testDebugUnitTest :app:testDebugUnitTest :app:assembleBenchmark
